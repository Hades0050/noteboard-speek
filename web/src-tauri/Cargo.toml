[package]
name = "noteboard-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[workspace]
members = ["core"]

[lib]
name = "noteboard_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
noteboard-core = { path = "core" }
base64 = "0.22"
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
