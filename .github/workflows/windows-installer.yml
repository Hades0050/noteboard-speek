name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Test native core
        run: cargo test --locked --manifest-path web/src-tauri/core/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build installer
        working-directory: web
        run: bun run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: noteboard-windows-x64
          path: web/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
